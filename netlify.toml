# Statische Site: HTML/CSS/JS liegen im Repository-Root.
# Ohne diese Angabe kann `netlify dev` ein falsches/leeres Publish-Verzeichnis
# verwenden und liefert für http://localhost:8888/ einen 404.
[build]
  publish = "."

# Trust Center: einzelne Dokumente als eigene URLs (Rewrite, kein Redirect),
# damit /trust.html das Dokument anhand des Pfads aktiviert.
[[redirects]]
  from = "/trust/privacy-policy"
  to = "/trust.html"
  status = 200

[[redirects]]
  from = "/trust/gtc"
  to = "/trust.html"
  status = 200

[[redirects]]
  from = "/trust/security"
  to = "/trust.html"
  status = 200
